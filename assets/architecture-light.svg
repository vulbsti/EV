<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<rect width="880" height="470" fill="#ffffff"/>
<rect x="20" y="40" width="150" height="100" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="36" y="68" font-size="16" font-weight="600" fill="#1f2328">You</text>
<text x="36" y="92" font-size="13" fill="#59636e">say it roughly,</text>
<text x="36" y="112" font-size="13" fill="#59636e">in one conversation</text>
<rect x="250" y="20" width="300" height="160" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="266" y="48" font-size="16" font-weight="600" fill="#1f2328">EV</text>
<text x="266" y="72" font-size="13" fill="#59636e">reads every message with what it</text>
<text x="266" y="92" font-size="13" fill="#59636e">knows about you and the work</text>
<text x="266" y="112" font-size="13" fill="#59636e">under way, looks up anything else,</text>
<text x="266" y="132" font-size="13" fill="#59636e">then acts through tools: reply, ask,</text>
<text x="266" y="152" font-size="13" fill="#59636e">start work, tell or hold work, remember</text>
<rect x="630" y="20" width="230" height="160" rx="12" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
<text x="646" y="48" font-size="16" font-weight="600" fill="#1f2328">Work</text>
<text x="646" y="72" font-size="13" fill="#59636e">OpenClaw agents, each in</text>
<text x="646" y="92" font-size="13" fill="#59636e">its own container and folder,</text>
<text x="646" y="112" font-size="13" fill="#59636e">keeping session and files</text>
<text x="646" y="132" font-size="13" fill="#59636e"></text>
<text x="646" y="152" font-size="13" fill="#59636e">reviewer opens the result and</text>
<text x="646" y="172" font-size="13" fill="#59636e"></text>
<text x="646" y="172" font-size="13" fill="#59636e">sends it back until it is right</text>
<rect x="250" y="250" width="300" height="100" rx="12" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/>
<text x="266" y="278" font-size="16" font-weight="600" fill="#1f2328">Learner</text>
<text x="266" y="302" font-size="13" fill="#59636e">turns what happened into memory:</text>
<text x="266" y="322" font-size="13" fill="#59636e">said vs guessed, with evidence,</text>
<text x="266" y="342" font-size="13" fill="#59636e">and a dated history</text>
<rect x="20" y="250" width="150" height="100" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="36" y="278" font-size="16" font-weight="600" fill="#1f2328">Importers</text>
<text x="36" y="302" font-size="13" fill="#59636e">your Claude Code</text>
<text x="36" y="322" font-size="13" fill="#59636e">sessions</text>
<rect x="20" y="390" width="840" height="60" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="440" y="416" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">One store on your machine</text>
<text x="440" y="436" font-size="13" fill="#59636e" text-anchor="middle">SQLite, files and one full-text index that EV, agents and the reviewer all search; forget removes from all of it</text>
<path d="M170 75L248 75" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="209" y="68" font-size="12" fill="#59636e" text-anchor="middle">message</text>
<path d="M248 115L172 115" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="209" y="132" font-size="12" fill="#59636e" text-anchor="middle">reply, ask</text>
<path d="M550 75L628 75" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="589" y="68" font-size="12" fill="#59636e" text-anchor="middle">brief</text>
<path d="M628 125L552 125" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="589" y="142" font-size="12" fill="#59636e" text-anchor="middle">result</text>
<path d="M400 182L400 248" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="410" y="220" font-size="12" fill="#59636e">every turn and finished work</text>
<path d="M95 352L95 388" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M400 352L400 388" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M745 182L745 388" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="755" y="290" font-size="12" fill="#59636e">results, files</text>
</svg>
