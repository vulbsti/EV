name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22.19", "24"]
        include:
          - os: macos-latest
            node: "24"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify

  install:
    name: install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: bash -n install.sh bin/ev
      - name: Install from this checkout
        run: EV_REPO="$PWD" EV_HOME="$RUNNER_TEMP/ev" ./install.sh --no-image
      - name: Start, check and stop the daemon
        run: |
          ev="$HOME/.local/bin/ev"
          "$ev" start
          curl -fsS -o /dev/null "$("$ev" status | grep -o 'http://[^ ]*')"
          "$ev" stop
