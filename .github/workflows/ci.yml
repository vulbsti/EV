name: CI

# Kept to one small Linux job while EV is a prototype, to save Actions minutes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify
      - name: Installer and ev command
        run: |
          EV_REPO="$PWD" EV_HOME="$RUNNER_TEMP/ev" ./install.sh --no-image
          ev="$HOME/.local/bin/ev"
          "$ev" start
          curl -fsS -o /dev/null "$("$ev" status | grep -o 'http://[^ ]*')"
          "$ev" stop
