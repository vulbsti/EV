name: Idea
description: Suggest something KenWise should do or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to get done
      description: The situation, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How it could work
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a pull request for this.
